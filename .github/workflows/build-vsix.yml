name: Build VSIX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # CI owns the patch digit for main builds. The rolling prerelease records
      # the previous build version, so the patch increments within a major/minor
      # line and resets to 0 when package.json moves to a new line.
      # Only ever written in the runner's checkout — never committed back.
      - name: Stamp build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const fs = require("fs");
            const { spawnSync } = require("child_process");
            const p = "packages/extension/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const [major, minor] = j.version.split(".");
            let patch = 0;

            if (process.env.GITHUB_EVENT_NAME === "push") {
              const release = spawnSync(
                "gh",
                ["release", "view", "main-latest", "--json", "name", "--jq", ".name"],
                { encoding: "utf8" },
              );
              if (release.status === 0) {
                const title = release.stdout.trim();
                const previous = title.match(/\((\d+)\.(\d+)\.(\d+)\)$/);
                if (!previous) {
                  throw new Error("Unexpected main-latest release title: " + title);
                }
                if (previous[1] === major && previous[2] === minor) {
                  patch = Number(previous[3]) + 1;
                }
              } else if (!release.stderr.includes("release not found")) {
                throw new Error("Could not read main-latest release: " + release.stderr.trim());
              }
            }

            j.version = major + "." + minor + "." + patch;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + j.version + "\n");
          '

      - name: Test
        run: npm test

      - name: Build workspaces
        run: npm run build

      # vsce runs vscode:prepublish, which re-bundles the extension minified.
      - name: Package VSIX
        run: npm run package --workspace=packages/extension -- --pre-release

      - name: Resolve VSIX path
        id: vsix
        run: echo "path=$(ls packages/extension/*.vsix | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: agent-insights-${{ steps.version.outputs.version }}
          path: ${{ steps.vsix.outputs.path }}
          if-no-files-found: error

      # Rolling prerelease so the newest main build always has a stable download
      # URL. Workflow artifacts expire and require a GitHub login; this doesn't.
      - name: Publish rolling main prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete main-latest --yes --cleanup-tag || true
          gh release create main-latest "${{ steps.vsix.outputs.path }}" \
            --prerelease \
            --title "Latest main build (${{ steps.version.outputs.version }})" \
            --notes "Automated build of ${{ github.sha }}."
